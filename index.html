    <script>
      (function () {
        var resizeRe = /ResizeObserver loop (completed with undelivered notifications|limit exceeded)/i;

        if (typeof window !== 'undefined') {
          // 1. Wrap native ResizeObserver to throttle callbacks via requestAnimationFrame
          if (typeof window.ResizeObserver !== 'undefined') {
            var NativeResizeObserver = window.ResizeObserver;
            window.ResizeObserver = class PatchedResizeObserver extends NativeResizeObserver {
              constructor(callback) {
                var frame = null;
                var lastEntries = null;
                var lastObserver = null;
                super(function (entries, observer) {
                  lastEntries = entries;
                  lastObserver = observer;
                  if (frame === null) {
                    frame = window.requestAnimationFrame(function () {
                      frame = null;
                      if (lastEntries && lastObserver) {
                        try {
                          callback(lastEntries, lastObserver);
                        } catch (err) {
                          if (err && resizeRe.test(err.message || '')) {
                            // Suppress benign loop notification
                            return;
                          }
                          throw err;
                        }
                        lastEntries = null;
                        lastObserver = null;
                      }
                    });
                  }
                });
              }
            };
          }

          // 2. Global window.onerror handler
          var prevOnError = window.onerror;
          window.onerror = function (msg, url, line, col, err) {
            if (typeof msg === 'string' && resizeRe.test(msg)) {
              return true;
            }
            if (err && err.message && resizeRe.test(err.message)) {
              return true;
            }
            if (typeof prevOnError === 'function') {
              return prevOnError.apply(this, arguments);
            }
            return false;
          };

          // 3. Error event listener with stopImmediatePropagation
          window.addEventListener(
            'error',
            function (e) {
              if (
                e &&
                (resizeRe.test(e.message || '') ||
                  (e.error && resizeRe.test(e.error.message || '')))
              ) {
                e.stopImmediatePropagation();
                e.preventDefault();
              }
            },
            true
          );

          // 4. Unhandled rejection listener
          window.addEventListener(
            'unhandledrejection',
            function (e) {
              if (
                e &&
                e.reason &&
                ((typeof e.reason === 'string' && resizeRe.test(e.reason)) ||
                  (e.reason.message && resizeRe.test(e.reason.message)))
              ) {
                e.stopImmediatePropagation();
                e.preventDefault();
              }
            },
            true
          );
        }
      })();
    </script>
