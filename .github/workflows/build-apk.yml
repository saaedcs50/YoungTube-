name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - '.github/workflows/build-apk.yml'
      - 'android/**'
      - 'capacitor.config.*'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install dependencies
        run: npm ci

      - name: Run navigation history tests
        run: npm run test:navigation

      - name: Run parent inbox contract tests
        run: npm run test:parent-inbox

      - name: Type check application
        run: npm run lint

      - name: Type check worker
        run: npm run typecheck:worker

      - name: Build web assets
        run: npm run build

      - name: Add Capacitor Android platform if missing
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Configure persistent Release Signing Keystore
        id: release-signing
        env:
          KEYSTORE_BASE64: ${{ secrets.YOUNGTUBE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/release.keystore
            echo "YOUNGTUBE_KEYSTORE_PATH=release.keystore" >> "$GITHUB_ENV"
            echo "YOUNGTUBE_KEYSTORE_PASSWORD=${{ secrets.YOUNGTUBE_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "YOUNGTUBE_KEY_ALIAS=${{ secrets.YOUNGTUBE_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "YOUNGTUBE_KEY_PASSWORD=${{ secrets.YOUNGTUBE_KEY_PASSWORD }}" >> "$GITHUB_ENV"
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Persistent release keystore configured. A Release APK may be built and uploaded."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Persistent release keystore is not configured. Skipping Release APK to prevent a debug-signed artifact from being mistaken for an installable update. Debug APK will still be built for testing."
          fi

      - name: Compute Android version
        run: |
          echo "VERSION_CODE=$((GITHUB_RUN_NUMBER + 100))" >> "$GITHUB_ENV"
          echo "VERSION_NAME=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Build Android Release APK
        if: steps.release-signing.outputs.available == 'true'
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Release APK
        if: steps.release-signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: youngtube-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: youngtube-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
